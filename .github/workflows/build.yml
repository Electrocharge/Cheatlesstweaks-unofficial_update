name: Build and release LeviLauncher mod

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Build ARM64 package
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./scripts/build.sh arm64-v8a

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: command-cheats-bypass-arm64
          path: dist/command_cheats_bypass-arm64-v8a.levipack

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/command_cheats_bypass-arm64-v8a.levipack \
            --repo "$GITHUB_REPOSITORY" \
            --title "Command Cheats Bypass $GITHUB_REF_NAME" \
            --generate-notes
