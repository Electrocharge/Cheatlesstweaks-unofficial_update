name: Build and release LeviLauncher mod

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK"
            find "$SDK" -maxdepth 6 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          export PATH="$SDKMANAGER_DIR:$SDK/platform-tools:$PATH"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --version

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Build ARM64 package
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_HOME="$SDK/ndk/28.2.13676358"
          ./scripts/build.sh arm64-v8a

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: command-cheats-bypass-arm64
          path: dist/command_cheats_bypass-arm64-v8a.levipack

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/command_cheats_bypass-arm64-v8a.levipack \
            --repo "$GITHUB_REPOSITORY" \
            --title "Command Cheats Bypass $GITHUB_REF_NAME" \
            --generate-notes
